services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthcare_user
      POSTGRES_PASSWORD: healthcare_pass
      POSTGRES_DB: healthcare_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthcare-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U healthcare_user -d healthcare_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: healthcare-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: healthcare_db
      DB_USER: healthcare_user
      DB_PASSWORD: healthcare_pass
      JWT_SECRET: change-this-in-prod
      CORS_ORIGIN: https://your-domain.com
    networks:
      - healthcare-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: healthcare-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist/healthcare-portal:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - healthcare-network
    depends_on:
      - backend

networks:
  healthcare-network:
    driver: bridge

volumes:
  postgres_data:
