events { }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Redirect all HTTP traffic to HTTPS
  server {
    listen 80;
    server_name toosmartcare.in www.toosmartcare.in;
    return 301 https://$host$request_uri;
  }

  # HTTPS server block
  server {
    listen 443 ssl;
    server_name toosmartcare.in www.toosmartcare.in;

    # SSL certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/toosmartcare.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toosmartcare.in/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Enable HSTS (forces HTTPS in browsers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Angular routes fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
      proxy_pass http://healthcare-backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Force correct MIME types
    types {
      text/html html htm;
      application/javascript js;
      text/css css;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
      expires 6M;
      access_log off;
      add_header Cache-Control "public";
    }
  }
}
