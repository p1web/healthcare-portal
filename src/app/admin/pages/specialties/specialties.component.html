<div class="pagetitle">
    <!-- <h1>Specialties</h1> -->
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="admin/dashboard">Home</a></li>
            <li class="breadcrumb-item active">Specialties</li>
        </ol>
    </nav>
</div><!-- End Page Title -->

<section class="section">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title mb-0">Specialties</h5>

                        <a href="javascript:void(0)" class="btn btn-primary" (click)="openAddSpecialtyModal()"
                            data-bs-toggle="modal" data-bs-target="#createSpecialityModal">
                            <i class="bi bi-plus me-1"></i>
                            Add New Specialty
                        </a>
                    </div>
                    <table class="table table-borderless datatable">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Specialty Name</th>
                                <th scope="col">Description</th>
                                <th scope="col">Created At</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let s of specialtiesList; let i = index">
                                <th scope="row">{{ i + 1 }}</th>
                                <td>
                                    <a class="btn-link">{{ s?.name }}</a>
                                </td>
                                <td>{{ s?.description }}</td>
                                <td>{{ s?.created_at | date:'dd MMM yyyy' }}</td>
                                <td>

                                    <button class="btn btn-sm btn-outline-primary me-1"
                                        (click)="openEditSpecialtyModal(s)" data-bs-toggle="modal"
                                        data-bs-target="#editSpecialtyModal">
                                        <i class="bi bi-eye"></i> Edit
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" (click)="deleteSpecialty(s?.id)">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>

                                </td>
                            </tr>
                        </tbody>

                    </table>



                    <div class="modal fade" id="createSpecialityModal" tabindex="-1">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content"> <!-- Modal Header -->
                                <div class="modal-header">
                                    <h5 class="modal-title">Create New Specialty</h5> <button type="button"
                                        class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <!-- Modal Body -->
                                <div class="modal-body">
                                    <form [formGroup]="specialtyForm" (ngSubmit)="saveSpecialty()">
                                        <div class="form-group mb-3">
                                            <label class="form-label">Specialty Name</label>
                                            <input type="text" class="form-control" formControlName="specialty_name" placeholder="Specialty Name">
                                            <!-- Inline validation -->
                                            <div *ngIf="specialtyForm.get('specialty_name')?.invalid && specialtyForm.get('specialty_name')?.touched"
                                                class="text-danger small">
                                                Specialty Name is required
                                            </div>
                                        </div>
                                    
                                        <div class="form-group mb-3">
                                            <label class="form-label">Specialty Icon</label>
                                            <input type="text" class="form-control" formControlName="specialty_icon"
                                                placeholder="Specialty Icon (e.g. bi bi-heart)">
                                        </div>
                                    
                                        <div class="form-group mb-3">
                                            <label class="form-label">Description</label>
                                            <input type="text" class="form-control" formControlName="specialty_description" placeholder="Description">
                                        </div>
                                    
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                            <button type="submit" class="btn btn-primary" [disabled]="specialtyForm.invalid">Save</button>
                                        </div>
                                    </form>


                                </div>


                            </div>
                        </div>
                    </div>


                    <div class="modal fade" id="editSpecialtyModal" tabindex="-1">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content"> <!-- Modal Header -->
                                <div class="modal-header">
                                    <h5 class="modal-title">Update Specialty</h5> <button type="button"
                                        class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <!-- Modal Body -->
                                <div class="modal-body">
                                    <form [formGroup]="editSpecialtyForm" (ngSubmit)="updateSpecialty()">
                                        <div class="form-group mb-3">
                                            <label class="form-label">Specialty Name</label>
                                            <input type="text" class="form-control" formControlName="specialty_name" placeholder="Specialty Name" value="{{ editSpecialtyForm.get('specialty_name')?.value }}">
                                             <div *ngIf="editSpecialtyForm.get('specialty_name')?.invalid && editSpecialtyForm.get('specialty_name')?.touched"
                                                class="text-danger small">
                                                Specialty Name is required
                                            </div>
                                        </div>

                                        <div class="form-group mb-3">
                                            <label class="form-label">Specialty Icon</label>
                                            <input type="text" class="form-control" formControlName="specialty_icon"
                                                placeholder="Specialty Icon (e.g. bi bi-heart)" value="{{ editSpecialtyForm.get('specialty_icon')?.value }}">
                                        </div>

                                        <div class="form-group mb-3">
                                            <label class="form-label">Description</label>
                                            <input type="text" class="form-control" formControlName="specialty_description"
                                                placeholder="Description" value="{{ editSpecialtyForm.get('specialty_description')?.value }}">
                                        </div>

                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary"
                                                data-bs-dismiss="modal">Close</button>
                                            <button type="submit" class="btn btn-primary">Save</button>
                                        </div>
                                    </form>

                                </div>


                            </div>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
</section>
