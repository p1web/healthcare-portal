<div class="profile-page">
  <div class="profile-header">
    <div class="profile-avatar">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <div>
      <h4 class="mb-1">Change Password</h4>
      <span class="role-badge">Security Settings</span>
    </div>
  </div>

  <div *ngIf="success" class="alert alert-success alert-dismissible fade show">
    <i class="bi bi-check-circle me-2"></i>{{ success }}
    <button type="button" class="btn-close" (click)="success = ''"></button>
  </div>

  <div *ngIf="error" class="alert alert-danger alert-dismissible fade show">
    <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
    <button type="button" class="btn-close" (click)="error = ''"></button>
  </div>

  <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
    <section class="profile-section">
      <h6 class="section-title"><i class="bi bi-key-fill"></i> Update Your Password</h6>

      <div class="mb-3">
        <label class="form-label">Current Password <span class="text-danger">*</span></label>
        <input type="password" class="form-control" formControlName="currentPassword"
          [class.is-invalid]="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched" />
        <div class="invalid-feedback"
          *ngIf="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched">
          Current password is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password <span class="text-danger">*</span></label>
        <input type="password" class="form-control" formControlName="newPassword"
          [class.is-invalid]="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched" />
        <div class="invalid-feedback"
          *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched">
          <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['required']">New password is required</span>
          <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6
            characters</span>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm New Password <span class="text-danger">*</span></label>
        <input type="password" class="form-control" formControlName="confirmPassword"
          [class.is-invalid]="changePasswordForm.get('confirmPassword')?.invalid && changePasswordForm.get('confirmPassword')?.touched" />
        <div class="invalid-feedback"
          *ngIf="changePasswordForm.get('confirmPassword')?.invalid && changePasswordForm.get('confirmPassword')?.touched">
          Please confirm your new password
        </div>
      </div>
    </section>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary px-4" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">
          <i class="bi bi-check-circle me-1"></i> Update Password
        </span>
        <span *ngIf="isSubmitting">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Updating...
        </span>
      </button>
    </div>
  </form>
</div>
