<div class="pagination-footer" *ngIf="totalItems">
  <div class="pagination-info" *ngIf="showSummary || showPageSize">
    <span *ngIf="showSummary" class="text-muted small">
      Showing <strong>{{ rangeStart }}–{{ rangeEnd }}</strong> of
      <strong>{{ totalItems }}</strong>
    </span>
    <div class="page-size" *ngIf="showPageSize">
      <label class="text-muted small mb-0">Rows per page:</label>
      <select class="form-select form-select-sm" [ngModel]="pageSize"
              (ngModelChange)="onPageSizeChange($event)">
        <option *ngFor="let size of pageSizeOptions" [ngValue]="size">{{ size }}</option>
      </select>
    </div>
  </div>

  <nav *ngIf="totalPages > 1" aria-label="Pagination">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button type="button" class="page-link" (click)="goToPage(1)"
                [disabled]="currentPage === 1" aria-label="First page">
          <i class="bi bi-chevron-double-left"></i>
        </button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button type="button" class="page-link" (click)="goToPage(currentPage - 1)"
                [disabled]="currentPage === 1" aria-label="Previous page">
          <i class="bi bi-chevron-left"></i>
        </button>
      </li>
      <li class="page-item" *ngFor="let p of visiblePages" [class.active]="p === currentPage">
        <button type="button" class="page-link" (click)="goToPage(p)"
                [attr.aria-current]="p === currentPage ? 'page' : null">{{ p }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button type="button" class="page-link" (click)="goToPage(currentPage + 1)"
                [disabled]="currentPage === totalPages" aria-label="Next page">
          <i class="bi bi-chevron-right"></i>
        </button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button type="button" class="page-link" (click)="goToPage(totalPages)"
                [disabled]="currentPage === totalPages" aria-label="Last page">
          <i class="bi bi-chevron-double-right"></i>
        </button>
      </li>
    </ul>
  </nav>
</div>
