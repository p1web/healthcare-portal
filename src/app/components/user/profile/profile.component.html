<app-breadcrumb title="My Profile"></app-breadcrumb>

<div class="card border mb-3">
  <div class="card-header border-bottom">
    <h5>My Profile</h5>
  </div>
  <div class="card-body">
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label>Name</label>
        <input type="text" class="form-control" formControlName="name">
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" formControlName="email" readonly>
      </div>

      <div class="mb-3">
        <label>Phone</label>
        <input type="text" class="form-control" formControlName="phone">
      </div>

      <div class="mb-3">
        <label>Role</label>
        <input type="text" class="form-control" formControlName="role" readonly>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">
        Save Changes
      </button>
    </form>
  </div>
</div>
